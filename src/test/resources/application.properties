spring.config.import=classpath:readiness.properties
spring.jackson.mapper.allow-coercion-of-scalars=false
spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.datatype.enum.fail-on-numbers-for-enums=true
spring.datasource.url=${TEST_DATABASE_URL:jdbc:h2:mem:session_manager;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
spring.datasource.username=${TEST_DATABASE_USER:session_manager}
spring.datasource.password=${TEST_DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# All mappings use annotations; do not initialize the removed XML/JAXB implementation.
spring.jpa.properties.hibernate.xml_mapping_enabled=false
