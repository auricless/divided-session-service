spring.config.import=classpath:readiness.properties
# Preserve the request's explicit integer, enum-name, and boolean contract.
spring.jackson.mapper.allow-coercion-of-scalars=false
spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.datatype.enum.fail-on-numbers-for-enums=true

# Phase 2 persistence is configured independently of the framework-free core.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/session_manager}
spring.datasource.username=${DATABASE_USER:session_manager}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# All mappings use annotations; do not initialize the removed XML/JAXB implementation.
spring.jpa.properties.hibernate.xml_mapping_enabled=false
